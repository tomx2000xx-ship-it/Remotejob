name: Build and deploy RemoteWay

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and verify production files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record exact source revision
        run: |
          echo "Source commit: $(git rev-parse HEAD)"
          echo "Branch/ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          {
            echo "## RemoteWay build audit"
            echo "- Source commit: `$(git rev-parse HEAD)`"
            echo "- Ref: `$GITHUB_REF`"
            echo "- Trigger: `$GITHUB_EVENT_NAME`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Verify non-empty production output
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s dist/index.html ]; then
            echo "::error::Build did not produce a non-empty dist/index.html."
            exit 1
          fi
          file_count="$(find dist -type f | wc -l | tr -d ' ')"
          total_bytes="$(du -sb dist | cut -f1)"
          if [ "$file_count" -lt 2 ]; then
            echo "::error::Build output looks incomplete: only $file_count file(s) in dist."
            find dist -maxdepth 3 -type f -print
            exit 1
          fi
          echo "Verified dist/index.html; files=$file_count; bytes=$total_bytes"
          find dist -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort
          {
            echo ""
            echo "### Build output verification"
            echo "- Result: PASS"
            echo "- Non-empty dist/index.html: yes"
            echo "- Files in dist: $file_count"
            echo "- Total bytes: $total_bytes"
            echo ""
            echo "File listing (first 100 files):"
            echo '~~~text'
            find dist -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort | head -100
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Optional Wrangler deploy (requires Cloudflare secrets)
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check Cloudflare CLI credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Wrangler deployment was NOT performed by GitHub Actions: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is missing. A separate Cloudflare Git integration, if configured, must deploy independently and be verified in Cloudflare."
            {
              echo ""
              echo "## Cloudflare deployment status"
              echo "- GitHub Actions Wrangler deployment: **SKIPPED**"
              echo "- Reason: required Cloudflare CLI secrets are missing."
              echo "- Important: a successful build check does not mean the live Worker was deployed."
              echo "- Verify the separate Cloudflare Git integration by matching its build commit and production Worker deployment to the source commit above."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare CLI credentials are configured."
          fi

      - name: Deploy with Wrangler
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Report Wrangler deployment result
        if: always() && steps.cloudflare.outputs.configured == 'true'
        run: |
          {
            echo ""
            echo "## Cloudflare CLI deployment"
            echo "- Wrangler action was invoked for source commit: `$(git rev-parse HEAD)`."
            echo "- Confirm the resulting deployment in Cloudflare; this summary alone is not proof of live production."
          } >> "$GITHUB_STEP_SUMMARY"
